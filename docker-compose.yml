      - center-point-network

  # ---------------------------------------------------------------------------
  # Service: TranslationWorker (no HTTP port)
  # ---------------------------------------------------------------------------
  translation-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_NAME: TranslationWorker
    container_name: cpi-translation-worker
    restart: unless-stopped
    environment:
      # --- Database ---
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=center_point_inbox;Username=cpi_admin;Password=cpi_dev_password_2024"
      # --- RabbitMQ ---
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: cpi_rabbit
      RabbitMQ__Password: cpi_rabbit_password
      RabbitMQ__VirtualHost: center_point
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # --- MinIO / S3 ---
      S3__Endpoint: http://minio:9000
      S3__AccessKey: cpi_minio_admin
      S3__SecretKey: cpi_minio_password
      S3__BucketName: translations
      S3__UseSSL: "false"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      # --- JWT ---
      Jwt__Issuer: CenterPointInbox
      Jwt__Audience: CenterPointInboxClient
      Jwt__SigningKey: dev-jwt-signing-key-change-in-production-min-32-chars!!
      Jwt__TokenEncryptionKey: dev-token-encryption-key-32ch!!
      # --- Dependency wait ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # --- Service ---
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f TranslationWorker.dll || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - center-point-network

