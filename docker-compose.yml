      - "5002:8080"
    environment:
      # --- Database ---
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=center_point_inbox;Username=cpi_admin;Password=cpi_dev_password_2024"
      # --- RabbitMQ ---
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: cpi_rabbit
      RabbitMQ__Password: cpi_rabbit_password
      RabbitMQ__VirtualHost: center_point
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # --- JWT ---
      Jwt__Issuer: CenterPointInbox
      Jwt__Audience: CenterPointInboxClient
      Jwt__SigningKey: dev-jwt-signing-key-change-in-production-min-32-chars!!
      Jwt__TokenEncryptionKey: dev-token-encryption-key-32ch!!
      # --- Google OAuth (replace with real values) ---
      Google__ClientId: YOUR_GOOGLE_CLIENT_ID
      Google__ClientSecret: YOUR_GOOGLE_CLIENT_SECRET
      # --- Dependency wait ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # --- Service ---
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
