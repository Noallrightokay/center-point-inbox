      Jwt__TokenEncryptionKey: dev-token-encryption-key-32ch!!
      # --- AI Provider (replace with real values) ---
      OpenAI__ApiKey: YOUR_OPENAI_API_KEY
      OpenAI__Model: gpt-4o
      # --- Dependency wait ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # --- Service ---
