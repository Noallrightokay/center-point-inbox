name: Desktop CI

# The desktop app is where the mail layer lives now, and nothing was running it.
# rata-next-ci is filtered to `rata-next/**`, so a change that broke every IMAP
# test would have merged green.

on:
  push:
    branches: [main, develop]
    paths:
      - "desktop/**"
      # Named although desktop/** covers it, so the harness stays a trigger if
      # that line is ever narrowed.
      - "desktop/rata-app/harness/**"
      # The interface the harness drives, and the shell's web assets.
      - "rata-next/public/**"
      # The harness imports Playwright from rata-next/node_modules, so a
      # change to what rata-next installs can break it.
      - "rata-next/package.json"
      - "rata-next/package-lock.json"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "desktop/rata-app/harness/**"
      # The shell build assembles its web assets from rata-next/public, so a
      # change there can break this build without touching desktop/ at all.
      - "rata-next/public/**"
      - "rata-next/package.json"
      - "rata-next/package-lock.json"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than `stable`. With -D warnings an unpinned toolchain means a
  # new clippy lint reddens an unrelated pull request on the day it ships, which
  # trains everyone to ignore the colour. Bump it deliberately.
  RUST: "1.94.1"

jobs:
  # The mail layer on its own: no GTK, no webview, nothing to install. It holds
  # most of the logic and all of the outbound guard, so it is worth having an
  # answer from it in a minute rather than waiting on the shell.
  mail:
    name: Mail layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/rata-mail
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-mail

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Several of these resolve real names — gmail.com's table entry needs no
      # lookup, but anthropic.com's MX does, and that is the case the whole
      # discovery module exists for. They assert on the shape of the answer
      # rather than on a specific record, so a provider reshuffling its MX does
      # not turn into a red build.
      - name: Tests
        run: cargo test --all-targets

  # The mail layer against real servers: Dovecot for IMAP and GreenMail as the
  # SMTP sink, on this machine, with TLS verified against a CA made for the run
  # (tests/loopback/servers.sh). Everything above talks to scripted servers,
  # which only ever say what their author expected; the first real server that
  # behaves differently should be this one, not a customer's.
  loopback:
    name: Mail layer against real servers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop/rata-mail
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-mail

      # The feature lets the outbound guard connect to 127.0.0.1. It must be
      # impossible to ship: a release build with it on has to fail, and fail
      # for that reason rather than any other.
      - name: The loopback feature cannot build for release
        env:
          # Plain text, so the message can be matched and shown.
          CARGO_TERM_COLOR: never
        run: |
          if cargo build --release --features loopback-tests 2> release.log; then
            echo "::error::a release build with loopback-tests compiled"
            exit 1
          fi
          if ! grep -q "must never be on in a release build" release.log; then
            cat release.log
            echo "::error::the release build failed, but not on the loopback-tests gate"
            exit 1
          fi
          echo "Refused, as it must be:"
          grep -m1 -A2 "must never be on in a release build" release.log

      - name: Clippy, with the feature
        run: cargo clippy --all-targets --features loopback-tests -- -D warnings

      # apt waits on a stalled download almost for ever, which once used up
      # a whole job's time limit before any test ran (#110). Give up on a
      # stalled fetch after 30 s and try again, three times. A slow mirror
      # (about 100 KB/s on 2026-09-30) still takes minutes for the webview's
      # 100 MB, so each install step has 15 minutes, not the job's whole time.
      - name: Make apt retry a stalled download instead of hanging
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-rata-retries >/dev/null

      # Installing the package starts the system's own Dovecot on 143 and 993;
      # servers.sh runs one of its own there instead.
      - name: Install Dovecot
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dovecot-imapd
          sudo systemctl stop dovecot
          java -version

      - name: Start the servers
        run: sudo env "PATH=$PATH" tests/loopback/servers.sh start "$RUNNER_TEMP/rata-lb"

      - name: Tests against the servers
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/rata-lb/ca.crt
        run: cargo test --features loopback-tests --test loopback

      - name: Server logs
        if: failure()
        run: sudo tail -n 80 "$RUNNER_TEMP/rata-lb/dovecot.log" "$RUNNER_TEMP/rata-lb/greenmail.log" || true

  # The shell. Needs the system webview, and needs ui/ to exist before
  # tauri-build reads the config — which also means sync-ui.sh runs here, so its
  # three anchor checks against rata-next/public are part of CI rather than
  # something that fails on a release machine.
  app:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # apt waits on a stalled download almost for ever, which once used up
      # a whole job's time limit before any test ran (#110). Give up on a
      # stalled fetch after 30 s and try again, three times. A slow mirror
      # (about 100 KB/s on 2026-09-30) still takes minutes for the webview's
      # 100 MB, so each install step has 15 minutes, not the job's whole time.
      - name: Make apt retry a stalled download instead of hanging
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-rata-retries >/dev/null

      - name: Install the system webview
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-app/src-tauri

      - name: Assemble the web assets
        run: ./sync-ui.sh
        working-directory: desktop/rata-app

      - name: Formatting
        run: cargo fmt --check
        working-directory: desktop/rata-app/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/rata-app/src-tauri

      # Built without RATA_LICENCE_PUBLIC_KEY, which is not an oversight: with
      # no key the app refuses every licence rather than accepting any, and
      # these tests pass their own key in so they check the verifier either way.
      # A release supplies the real key; see desktop/rata-app/README.md.
      #
      # Debug only. A release build would compile four hundred crates a second
      # time to prove something the debug build already proved — that this
      # compiles — and packaging happens on the per-platform release machines
      # regardless, since Linux cannot sign a .dmg or a .msi.
      - name: Tests
        run: cargo test --all-targets
        working-directory: desktop/rata-app/src-tauri

  # The interface, driven. ui-harness.mjs opens ui/ exactly as sync-ui.sh
  # assembles it, under the app's own CSP from tauri.conf.json, with a fake
  # Tauri backend, and clicks through what the bridge promises. Until this job
  # it ran only when someone remembered to, so an app.html change that broke
  # the desktop app's behaviour could merge green. No Rust here: the harness
  # needs the assembled pages, Node and a browser, nothing compiled.
  harness:
    name: Desktop interface, driven
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the web assets
        run: ./sync-ui.sh
        working-directory: desktop/rata-app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rata-next/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rata-next

      # apt waits on a stalled download almost for ever, which once used up
      # a whole job's time limit before any test ran (#110). Give up on a
      # stalled fetch after 30 s and try again, three times. A slow mirror
      # (about 100 KB/s on 2026-09-30) still takes minutes for the webview's
      # 100 MB, so each install step has 15 minutes, not the job's whole time.
      - name: Make apt retry a stalled download instead of hanging
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-rata-retries >/dev/null

      # The harness imports Playwright from rata-next/node_modules, so the
      # browser is installed by that same pinned copy (run from rata-next): the
      # revision it downloads is the one the harness launches. Neither step
      # sets PLAYWRIGHT_BROWSERS_PATH, so both use the default cache.
      - name: Install Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
        working-directory: rata-next

      # Server and harness in one step, so the server is certainly up for the
      # whole run and certainly gone after it.
      - name: Drive the interface
        run: |
          python3 -m http.server 3181 --bind 127.0.0.1 --directory desktop/rata-app/ui \
            > "$RUNNER_TEMP/http.log" 2>&1 &
          # Quiet while it waits; the check after the loop says what went wrong.
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:3181/app.html && break
            sleep 0.5
          done
          curl -fsS -o /dev/null http://127.0.0.1:3181/app.html || {
            cat "$RUNNER_TEMP/http.log"
            echo "::error::the interface server did not start"
            exit 1
          }
          node desktop/rata-app/harness/ui-harness.mjs http://127.0.0.1:3181

      # The rules release.yml writes the update feed by (feed.cjs): a platform
      # missing from a release keeps its own feed, nothing moves backwards.
      - name: The update feed's rules
        run: node --test desktop/rata-app/harness/feed.test.cjs
