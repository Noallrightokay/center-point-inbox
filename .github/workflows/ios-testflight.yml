name: iOS to TestFlight

# RATA for iOS, signed for the App Store and uploaded to TestFlight, so the
# owner can install it on a real iPhone. Built as the Simulator and device
# jobs in ios.yml build it (tauri ios init, ios/prepare.sh, release, without
# self-update), with the store's bundle id, this run's number as the build
# number, and the real licence key. Every step is a step of
# desktop/rata-app/ios/testflight.sh, which says what each does and why.
#
# It needs four repository secrets, all or none: APPLE_API_KEY_ID,
# APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 and APPLE_TEAM_ID (an App Store
# Connect API key and the team), and the repository variable
# RATA_IOS_BUNDLE_ID (the app record's bundle id, org.mailrata.app when
# unset). With none of them it says "TestFlight is not set up yet" and ends
# green. With some but not all it fails before anything is built.
#
# On a pull request the real job goes only as far as that check, which
# proves the file parses and the check works against the real secrets. The
# rest is rehearsed there with invented values, which upload nothing:
#   none     nothing set: the check must say so and end green
#   half     two of the four: the check must fail and name the other two
#   made-up  all four, of the right shapes but nobody's: RATA is built
#            unsigned for a generic iOS device, then signing and uploading
#            are tried with that key, which Apple must refuse, and the job
#            must say what to fix and print none of the values
# The owner can run any of them by hand: Actions, this workflow, Run
# workflow, and the `values` choice (secrets is the real upload).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      # The shell compiles the interface in (sync-ui.sh).
      - "rata-next/public/**"
      - ".github/workflows/ios-testflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "rata-next/public/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      values:
        description: "secrets uploads to TestFlight. Test only: none, half and made-up rehearse the checks with invented values and upload nothing."
        type: choice
        default: secrets
        options: [secrets, none, half, made-up]

# A pull request's older run is of no use; an upload from main is let finish.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # As ios.yml; bump them together.
  RUST: "1.94.1"
  TAURI_CLI: "2.12.0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  testflight:
    name: "${{ matrix.values == 'secrets' && 'iOS app to TestFlight' || format('iOS app to TestFlight, rehearsed with {0} values', matrix.values) }}"
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        values: ${{ fromJSON(github.event_name == 'pull_request' && '["secrets","none","half","made-up"]' || (github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.values) || '["secrets"]')) }}
    steps:
      - uses: actions/checkout@v4

      # All or none, as the release workflow's signing secrets are: the
      # secrets enter this step's environment, and later steps' only once
      # this one has found all four (`build`). A rehearsal gets none of them.
      - name: Is TestFlight set up?
        id: config
        shell: bash
        env:
          VALUES: ${{ matrix.values }}
          RATA_CHECK_ONLY: ${{ github.event_name == 'pull_request' && '1' || '' }}
          APPLE_API_KEY_ID: ${{ matrix.values == 'secrets' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.values == 'secrets' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_API_KEY_P8: ${{ matrix.values == 'secrets' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_TEAM_ID: ${{ matrix.values == 'secrets' && secrets.APPLE_TEAM_ID || '' }}
          RATA_IOS_BUNDLE_ID: ${{ vars.RATA_IOS_BUNDLE_ID }}
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: |
          if [ "$VALUES" = secrets ]; then
            bash desktop/rata-app/ios/testflight.sh check
          else
            bash desktop/rata-app/ios/testflight.sh rehearse "$VALUES"
          fi

      - name: The configuration check's own tests
        if: matrix.values == 'made-up'
        run: bash desktop/rata-app/ios/testflight-test.sh

      - name: The newest Xcode this image has, which must be 26 or later
        if: steps.config.outputs.build == 'true'
        run: bash desktop/rata-app/ios/testflight.sh xcode

      - name: Install xcodegen and libimobiledevice, which tauri ios init asks for
        if: steps.config.outputs.build == 'true'
        timeout-minutes: 10
        run: brew install xcodegen libimobiledevice

      - uses: dtolnay/rust-toolchain@master
        if: steps.config.outputs.build == 'true'
        with:
          toolchain: ${{ env.RUST }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        if: steps.config.outputs.build == 'true'
        with:
          workspaces: desktop/rata-app/src-tauri
          key: ios-testflight
          cache-bin: "false"
          cache-on-failure: "true"

      # Shared with ios.yml's jobs, by the same key.
      - name: The Tauri CLI, cached
        id: tauri-cli
        if: steps.config.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ env.TAURI_CLI }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST }}

      - name: Install the Tauri CLI
        if: steps.config.outputs.build == 'true' && steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI" --locked

      - name: Keep the Tauri CLI
        if: steps.config.outputs.build == 'true' && steps.tauri-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ env.TAURI_CLI }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST }}

      # The store's build of the interface where sync-ui.sh has one: no buy
      # links, no updates (claude/store-page). A sync-ui.sh without it
      # ignores the variable and assembles the direct build; the archive
      # step says which this is.
      - name: Assemble the web assets
        if: steps.config.outputs.build == 'true'
        run: RATA_DISTRIBUTION=store ./sync-ui.sh
        working-directory: desktop/rata-app

      - name: The licence's public key, for the Rust build
        if: steps.config.outputs.build == 'true'
        env:
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: bash desktop/rata-app/ios/testflight.sh licence-key

      - name: Make the Xcode project, with the store's bundle id and this run's build number
        if: steps.config.outputs.build == 'true'
        env:
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
        run: bash desktop/rata-app/ios/testflight.sh project

      # Compiled here, before any Apple value is in the environment or the
      # key on disk, so that the signing below finds the Rust code built and
      # runs no build script of its own.
      - name: Build RATA, release and unsigned, for a generic iOS device
        if: steps.config.outputs.build == 'true'
        timeout-minutes: 60
        env:
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: bash desktop/rata-app/ios/testflight.sh archive

      - name: Sign it for App Store Connect
        if: steps.config.outputs.build == 'true' && matrix.values == 'secrets'
        timeout-minutes: 45
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
        run: bash desktop/rata-app/ios/testflight.sh sign

      - name: The signed app is RATA, for the store, as built
        if: steps.config.outputs.build == 'true' && matrix.values == 'secrets'
        env:
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: bash desktop/rata-app/ios/testflight.sh inspect

      - name: Upload it to TestFlight
        if: steps.config.outputs.build == 'true' && matrix.values == 'secrets'
        timeout-minutes: 30
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
        run: bash desktop/rata-app/ios/testflight.sh upload

      # Signing and uploading with a made-up key, which Apple must refuse.
      - name: Signing and uploading with a made-up key fail, and say why
        if: steps.config.outputs.build == 'true' && matrix.values == 'made-up'
        timeout-minutes: 45
        env:
          RATA_IOS_BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          RATA_BUILD_NUMBER: ${{ github.run_number }}
        run: bash desktop/rata-app/ios/testflight.sh rehearse apple

      # The signed .ipa, for seven days: what went to Apple, or what could be
      # uploaded by hand with Transporter if the upload failed. An App Store
      # build installs on no device but through TestFlight or the store.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.values == 'secrets' && env.IPA != ''
        with:
          name: RATA-ios-testflight-${{ github.run_number }}
          path: ${{ env.IPA }}
          retention-days: 7
          if-no-files-found: error

      - name: Delete the App Store Connect key
        if: always()
        run: bash desktop/rata-app/ios/testflight.sh forget
