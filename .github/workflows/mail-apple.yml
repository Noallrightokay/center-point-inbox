name: Mail on Apple systems

# The mail engine on Apple's systems, which nothing else tests before a
# release: its tests on macOS, both as the macOS app has it (hickory) and as
# an iOS build has it (the system's own resolver, src/dns_sd.rs), the
# system's resolver against real DNS, the engine's tests linked for iOS, and
# the same tests run in an iOS Simulator, as an iOS build makes them. Apple's
# iOS SDK is only on a Mac, so none of this can run on the Linux runners; a
# public repository's macOS runners cost nothing.

on:
  push:
    branches: [main]
    paths:
      - "desktop/rata-mail/**"
      - ".github/workflows/mail-apple.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/rata-mail/**"
      - ".github/workflows/mail-apple.yml"

concurrency:
  group: mail-apple-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain desktop-ci.yml pins; bump the two together.
  RUST: "1.94.1"
  # The oldest iOS the engine is built for: the app's own,
  # bundle.iOS.minimumSystemVersion in desktop/rata-app/src-tauri/
  # tauri.ios.conf.json (16.4, the oldest WebKit that runs the page's
  # script), which Tauri's iOS build sets for rustc and for the C that
  # aws-lc-sys compiles alike; a test of the shell (lib.rs) holds the two
  # equal. Without it a device build is linked for rustc's own default,
  # iOS 10, while aws-lc's objects are built for the SDK's version and call
  # ___chkstk_darwin, which that link cannot find.
  IPHONEOS_DEPLOYMENT_TARGET: "16.4"

jobs:
  mail:
    name: Mail layer on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/rata-mail
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: clippy

      - name: Add the iOS targets
        run: rustup target add --toolchain "$RUST" aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-mail

      # Every step from here runs even when one before it failed, so that
      # one run (and a macOS run takes a while) says everything that is
      # wrong. The job still fails if any of them does.

      # The macOS app's engine, hickory reading the system's DNS settings,
      # exactly as before.
      - name: Tests, with hickory as the macOS app has it
        if: ${{ !cancelled() }}
        run: cargo test --all-targets

      # The same tests with names looked up as iOS looks them up: every one
      # that resolves a real name (MX, SRV, the guard's addresses) goes
      # through dns_sd and getaddrinfo instead.
      - name: Tests, through the system's resolver as iOS has it
        if: ${{ !cancelled() }}
        run: cargo test --all-targets --features system-dns

      # resolve.rs `through_the_system`: MX, SRV, TXT and CNAME records from
      # real DNS, a name that does not exist (empty, and at once), a `.local`
      # domain (never asked), discovery and L1's evidence in time, and a TLS
      # greeting from an IMAP server at the addresses the system gave.
      # Ignored everywhere else; they need an Apple system and the network.
      - name: The system's resolver against real DNS
        if: ${{ !cancelled() }}
        # One at a time, so that each one's timing is its own.
        run: cargo test --lib --features system-dns -- --ignored --test-threads=1

      - name: Clippy, with the system's resolver
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features system-dns -- -D warnings

      - name: Clippy for iOS
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --target aarch64-apple-ios -- -D warnings

      # Nothing on iOS uses hickory, and its System Configuration reader is
      # macOS-only; neither may come back into the iOS build by another way.
      - name: No hickory in the iOS build
        if: ${{ !cancelled() }}
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            found=$(cargo tree --target "$target" -e normal --prefix none | grep -E '^(hickory|system-configuration|resolv-conf)' || true)
            if [ -n "$found" ]; then
              echo "::error::$target builds what iOS cannot use:"
              echo "$found"
              exit 1
            fi
          done
          echo "Neither iOS target builds hickory or System Configuration."

      - name: Build for iOS
        if: ${{ !cancelled() }}
        run: cargo build --target aarch64-apple-ios

      - name: Build for the iOS Simulator
        if: ${{ !cancelled() }}
        run: cargo build --target aarch64-apple-ios-sim

      # The engine is a library, so building it for iOS links nothing.
      # Linking its test programs is what sets dns_sd's functions and poll
      # (src/dns_sd.rs) against the iOS SDK's libSystem.
      - name: Link the tests for iOS
        if: ${{ !cancelled() }}
        run: cargo test --no-run --target aarch64-apple-ios

      - name: Link the tests for the iOS Simulator
        id: sim-tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --no-run --lib --target aarch64-apple-ios-sim --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            > "$RUNNER_TEMP/sim-tests.txt"
          bin=$(head -n 1 "$RUNNER_TEMP/sim-tests.txt")
          test -x "$bin"
          file "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # The engine has no app of its own, so the Simulator runs its test
      # program directly (`simctl spawn`): the code an iOS build really has
      # (`system_dns` from the target, not from a feature), asking the
      # Simulator's own resolver.
      - name: Start an iOS Simulator
        id: sim
        if: ${{ !cancelled() && steps.sim-tests.outcome == 'success' }}
        run: |
          set -o pipefail
          xcrun simctl list runtimes
          # An iPhone on the newest iOS the runner has.
          udid=$(xcrun simctl list -j devices available | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9-]+$"))
              | { v: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)),
                  d: [.value[] | select(.name | startswith("iPhone"))] }
              | select(.d | length > 0)]
            | sort_by(.v) | last | .d[0].udid // empty')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list -j runtimes | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier // empty')
            device=$(xcrun simctl list -j devicetypes | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")] | last | .identifier // empty')
            echo "No iPhone Simulator; making one: $device on $runtime"
            udid=$(xcrun simctl create rata-mail "$device" "$runtime")
          fi
          echo "Simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Whether or not `simctl spawn` passes on the program's exit status,
      # the step passes only on the harness's own "test result: ok".
      - name: Tests in the iOS Simulator
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BIN: ${{ steps.sim-tests.outputs.bin }}
        run: |
          set -o pipefail
          xcrun simctl spawn "$UDID" "$BIN" 2>&1 | tee "$RUNNER_TEMP/sim-tests.log"
          grep -q '^test result: ok\.' "$RUNNER_TEMP/sim-tests.log"

      - name: The system's resolver against real DNS, in the iOS Simulator
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BIN: ${{ steps.sim-tests.outputs.bin }}
        run: |
          set -o pipefail
          xcrun simctl spawn "$UDID" "$BIN" --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sim-dns.log"
          grep -q '^test result: ok\.' "$RUNNER_TEMP/sim-dns.log"
