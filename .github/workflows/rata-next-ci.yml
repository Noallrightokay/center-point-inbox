name: RATA CI

on:
  push:
    branches: [main, develop]
    paths:
      - "rata-next/**"
      - ".github/workflows/rata-next-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "rata-next/**"
      - ".github/workflows/rata-next-ci.yml"

concurrency:
  group: rata-next-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rata-next

jobs:
  # Build and test share a job: the suite runs against `next start`, so it needs
  # the production build anyway. Splitting them would mean building twice.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rata-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      # apt waits on a stalled download almost for ever, which once used up
      # a whole job's time limit before any test ran (#110). Give up on a
      # stalled fetch after 30 s and try again, three times.
      - name: Make apt retry a stalled download instead of hanging
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-rata-retries >/dev/null

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Covers the config route's refusal to publish a service_role key, the
      # OAuth state/cookie binding, the two-file Bridge, and the in-house
      # engine precache including an offline conversion.
      - name: Run tests
        run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: 1

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rata-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Any critical advisory fails the build unless it is named in
      # scripts/audit-gate.mjs with the reason it cannot reach this app and the
      # test that keeps that true. That list is currently empty and should stay
      # so — Next 16 cleared the two entries it held.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      # Everything below critical is reported without failing, so the count
      # stays visible in the log rather than being silently tolerated.
      - name: Report remaining advisories
        if: always()
        run: npm audit --omit=dev || true
