name: Release installers

# The three build machines RATA needs, because one machine cannot be all three:
# a .dmg has to be made on macOS and a Windows installer on Windows, and
# neither can be produced — let alone signed — from Linux.
#
# A release happens when `main` carries a version that has not been released
# yet: bump `version` in desktop/rata-app/src-tauri/tauri.conf.json (and the
# window title and Cargo.toml beside it), merge, and v<version> is built and
# published. Nobody creates a tag by hand. That step failed three times out of
# four in the GitHub UI — a tag field that rejects spaces, a dropdown that
# offers the old tag first, a "Publish" that did not publish — and it is also
# the one step an assistant session cannot do (tag pushes return 403 for it).
# The tag is created by this workflow's own token, when the release is
# published.
#
# Pushing a v* tag still works, and a manual run still builds installers to
# try without releasing anything.

on:
  push:
    branches: [main]
    # A merge that cannot change the app does not need to be looked at.
    paths:
      - "desktop/**"
      - "rata-next/public/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating the release and attaching installers to it is a write to the
# repository's contents, so the default read-only token is not enough.
permissions:
  contents: write

jobs:
  # Whether this run releases anything, and under which tag.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/rata-app/src-tauri/tauri.conf.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # 0.x is beta: marked pre-release so nobody mistakes it for finished.
          case "${version}" in 0.*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Manual run: installers only, no release."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "Tag ${REF_NAME} pushed: releasing it."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released — nothing to build. Bump the version to release."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} has not been released yet — building and releasing it."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

  # Nothing is built, let alone released, until the tests pass on the commit
  # being released. Until this job a merge that bumped the version went
  # straight to four installers and a published release, whatever the tests
  # said, since `main` has no branch protection to insist on Desktop CI.
  # After `plan`, so a merge without a version bump (build=false) stops there
  # and runs none of this. The same checks as desktop-ci.yml's Mail layer
  # tests, Desktop shell tests and Desktop interface, driven, step for step;
  # change them there and here together.
  gate:
    name: Tests before a release
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the system webview
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/rata-mail
            desktop/rata-app/src-tauri

      # Before the shell is compiled: Tauri compiles ui/ into the binary.
      - name: Assemble the web assets
        run: ./sync-ui.sh
        working-directory: desktop/rata-app

      - name: Mail layer tests
        run: cargo test --all-targets
        working-directory: desktop/rata-mail

      - name: Desktop shell tests
        run: cargo test --all-targets
        working-directory: desktop/rata-app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rata-next/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rata-next

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: rata-next

      - name: Drive the interface
        run: |
          python3 -m http.server 3181 --bind 127.0.0.1 --directory desktop/rata-app/ui \
            > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:3181/app.html && break
            sleep 0.5
          done
          curl -fsS -o /dev/null http://127.0.0.1:3181/app.html || {
            cat "$RUNNER_TEMP/http.log"
            echo "::error::the interface server did not start"
            exit 1
          }
          node desktop/rata-app/harness/ui-harness.mjs http://127.0.0.1:3181

      # The rules the publish job below writes the update feed by.
      - name: The update feed's rules
        run: node --test desktop/rata-app/harness/feed.test.cjs

  # One release, made before the builds rather than by them: four builds each
  # finding no release and creating one is a race that leaves duplicates. Made
  # as a draft so nobody sees an empty release while the installers build, and
  # reused if a draft for this tag already exists, so a re-run does not add a
  # second one. Only once the gate has passed (an `if` with no status check
  # runs only when every need succeeded).
  create-release:
    name: Create release
    needs: [plan, gate]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        with:
          script: |
            const { TAG, VERSION, PRERELEASE } = process.env;
            const pre = PRERELEASE === 'true';
            // listReleases includes drafts; getReleaseByTag does not.
            const all = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const found = all.find((r) => r.tag_name === TAG);
            if (found) {
              core.info(`Reusing release ${found.id} for ${TAG} (draft: ${found.draft}).`);
              core.setOutput('id', String(found.id));
              return;
            }
            const made = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name: pre ? `RATA ${VERSION} beta` : `RATA ${VERSION}`,
              body: [
                'Install RATA, then paste your licence key.',
                '',
                'Your mailbox passwords stay on this computer, in its own keychain.',
                ...(pre ? ['', 'This is a beta. How to test it and how to report a problem: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/BETA.md'] : []),
              ].join('\n'),
              draft: true,
              prerelease: pre,
            });
            core.info(`Created draft release ${made.data.id} for ${TAG} at ${context.sha}.`);
            core.setOutput('id', String(made.data.id));

  installers:
    name: ${{ matrix.name }}
    needs: [plan, gate, create-release]
    # create-release is skipped for a build-only run, and a skipped need would
    # otherwise skip this job too. `always()` switches off the implicit
    # "every need succeeded", so the gate is asked for by name.
    if: >-
      always() && needs.plan.outputs.build == 'true' &&
      needs.gate.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not cancel the other two: a macOS signing
      # problem is not a reason to throw away a finished Windows build.
      fail-fast: false
      matrix:
        include:
          # `slug` names the artifact and keys the cache. It is written out
          # rather than derived from `os` and `args`, which produced
          # "rata-macos-latest--target aarch64-apple-darwin" — a build flag and
          # a runner label, spaces and all, in the name of the thing somebody
          # downloads.
          - name: Linux (.deb, .AppImage)
            slug: linux
            os: ubuntu-22.04
            args: ""
          - name: macOS (Apple silicon)
            slug: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            slug: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Windows (.exe)
            slug: windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 rather than 24.04, deliberately: an AppImage built against
      # a newer glibc will not start on an older distribution, and the point of
      # an AppImage is that it runs anywhere. Build on the oldest thing you are
      # willing to support.
      - name: Install the system webview
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-app/src-tauri
          # The two macOS entries share a runner and build different targets,
          # so they must not share a cache.
          key: ${{ matrix.slug }}

      # Before the build, not after: Tauri compiles the web assets into the
      # binary, so building first would package whatever ui/ held last time.
      - name: Assemble the web assets
        run: ./sync-ui.sh
        shell: bash
        working-directory: desktop/rata-app

      # Refused rather than built without one. A build with no licence key
      # refuses every licence — which is the right way for it to fail, and
      # exactly the wrong thing to hand a customer who has paid.
      - name: Check the licence key is present
        shell: bash
        env:
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: |
          if [ -z "${RATA_LICENCE_PUBLIC_KEY}" ]; then
            echo "::error::RATA_LICENCE_PUBLIC_KEY is not set. Add it as a repository secret." >&2
            echo "Without it every installer this workflow produces refuses every licence." >&2
            echo "It is the public half — see rata-next/LICENSING.md — and is not a secret;" >&2
            echo "it lives in Actions secrets so it cannot be changed by accident." >&2
            exit 1
          fi
          case "${RATA_LICENCE_PUBLIC_KEY}" in
            *"BEGIN PUBLIC KEY"*) ;;
            *) echo "::error::RATA_LICENCE_PUBLIC_KEY does not look like a PEM public key." >&2; exit 1 ;;
          esac

      # Signing is opt-in, and it has to be all-or-nothing.
      #
      # These used to be passed straight to the build step, which looked
      # harmless: an unset secret becomes an empty string. But an empty string
      # is still a *set* variable, and Tauri's bundler reads APPLE_CERTIFICATE
      # with std::env::var — which returns Ok("") and takes that as "sign this".
      # It then handed nothing to `security import` and both macOS jobs died at
      # the bundling step with "failed to import keychain certificate", having
      # compiled everything successfully first. Linux and Windows were fine,
      # which is what made it look like a macOS problem rather than a workflow
      # one.
      #
      # So the variables only enter the environment when there is actually a
      # certificate, and the log says which build you are getting.
      - name: Configure macOS signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CERT}" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned."
            echo "::warning::This macOS build is unsigned. Gatekeeper will tell whoever opens it that RATA is damaged and can't be opened, which is indistinguishable from a broken download. Set the Apple signing secrets before sending it to anybody."
            exit 0
          fi
          # The heredoc form, because a certificate is base64 and a password
          # can contain anything.
          {
            printf 'APPLE_CERTIFICATE<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT}"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT_PASSWORD}"
            printf 'APPLE_SIGNING_IDENTITY<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${IDENTITY}"
          } >> "$GITHUB_ENV"
          echo "Signing with the configured Apple certificate."
          # Notarisation is a second, separate thing: without it a signed app
          # still warns on first open. Only switched on when all three are set,
          # because a half-configured notary fails the build at the very end.
          if [ -n "${NOTARY_ID}" ] && [ -n "${NOTARY_PASSWORD}" ] && [ -n "${NOTARY_TEAM}" ]; then
            {
              printf 'APPLE_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_ID}"
              printf 'APPLE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_PASSWORD}"
              printf 'APPLE_TEAM_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_TEAM}"
            } >> "$GITHUB_ENV"
            echo "Notarising as well."
          else
            echo "::warning::Signing but not notarising — APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. A signed but un-notarised app still warns on first open."
          fi

      # Updates are signed, and all-or-nothing like the Apple signing above.
      # TAURI_SIGNING_PRIVATE_KEY (and its password) is the key the owner made
      # with `tauri signer generate`, held nowhere but these secrets;
      # RATA_UPDATER_PUBKEY is its public half, compiled into the app so every
      # update is checked against it (update.rs). With both, the bundler signs
      # each installer and the publish job below writes the update feed. With
      # neither, the build is what it always was: an app that updates from the
      # releases page. Half of the pair is refused — an app that checks a feed
      # nothing signs, or signed installers no app can check, is a mistake
      # better found now than by a customer.
      - name: Configure updates
        id: updates
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ secrets.RATA_UPDATER_PUBKEY }}
        run: |
          if [ -z "${KEY}" ] && [ -z "${PUBKEY}" ]; then
            echo "No update key — this build cannot update itself."
            echo "::warning::No update signing key (TAURI_SIGNING_PRIVATE_KEY, RATA_UPDATER_PUBKEY). This build updates from the releases page only. See rata-next/LAUNCH.md."
            exit 0
          fi
          if [ -z "${KEY}" ] || [ -z "${PUBKEY}" ]; then
            echo "::error::Only half of the update key is set. TAURI_SIGNING_PRIVATE_KEY and RATA_UPDATER_PUBKEY go together — see rata-next/LAUNCH.md." >&2
            exit 1
          fi
          {
            printf 'TAURI_SIGNING_PRIVATE_KEY<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${KEY}"
            printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${KEY_PASSWORD}"
          } >> "$GITHUB_ENV"
          # Merged over tauri.conf.json by the CLI: the public key, which is
          # what the bundler signs against and what the app checks with, and
          # the signed update bundles. Written here, never committed, so a
          # build without the key cannot have one by accident.
          PUBKEY="${PUBKEY}" node -e 'require("fs").writeFileSync("desktop/rata-app/src-tauri/tauri.updater.conf.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY.trim()}}}))'
          echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          echo "Signing this build's installers for updates."

      # Windows code signing, optional and all-or-nothing like the two above.
      # docs/WINDOWS-SIGNING.md is the owner's side. Two ways, never both:
      #
      #   Azure Artifact Signing (formerly Trusted Signing): AZURE_TENANT_ID,
      #   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and the account's
      #   AZURE_ENDPOINT, AZURE_CODE_SIGNING_NAME and AZURE_CERT_PROFILE_NAME
      #   (those three are not secret and may be repository variables instead,
      #   which keeps a short account name from being masked all over the log).
      #   Tauri's bundler runs `signCommand`: signtool with Microsoft's dlib.
      #
      #   A certificate file: WINDOWS_CERTIFICATE (the .pfx, base64) and
      #   WINDOWS_CERTIFICATE_PASSWORD. It is decoded in memory and imported
      #   into this runner's certificate store, never written out as a file;
      #   the bundler then signs with Tauri's built-in signtool call, by
      #   thumbprint.
      #
      # Either way the signing happens inside the bundler, which is the only
      # place it can: tauri-action uploads the installer to the release the
      # moment it is built, the update signature (.sig) is made over the
      # installer as it stands, and the program inside the installer is packed
      # before either exists. Given a `signCommand` or a `certificateThumbprint`
      # the bundler signs rata-app.exe (after patching it, before NSIS packs
      # it), NSIS's plugin DLLs, the uninstaller and the finished -setup.exe.
      #
      # What is written to the Tauri config and so into the generated NSIS
      # script under target/ (which rust-cache saves, and a later run can
      # restore) is a path or a thumbprint, never a password or a key. That is
      # why the certificate goes through the store rather than
      # `signtool /f cert.pfx /p <password>` as a signCommand.
      - name: Configure Windows signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ secrets.AZURE_ENDPOINT || vars.AZURE_ENDPOINT }}
          AZ_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_NAME || vars.AZURE_CODE_SIGNING_NAME }}
          AZ_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME || vars.AZURE_CERT_PROFILE_NAME }}
          PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $azure = [ordered]@{
            AZURE_TENANT_ID = $env:AZ_TENANT; AZURE_CLIENT_ID = $env:AZ_CLIENT; AZURE_CLIENT_SECRET = $env:AZ_SECRET
            AZURE_ENDPOINT = $env:AZ_ENDPOINT; AZURE_CODE_SIGNING_NAME = $env:AZ_ACCOUNT; AZURE_CERT_PROFILE_NAME = $env:AZ_PROFILE
          }
          $azureMissing = @($azure.Keys | Where-Object { -not $azure[$_] })
          $useAzure = $azureMissing.Count -eq 0
          $usePfx = [bool]$env:PFX
          if ($azureMissing.Count -eq $azure.Count -and -not $env:PFX -and -not $env:PFX_PASSWORD) {
            Write-Output "No Windows signing secrets - building unsigned."
            "mode=none" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::This Windows build is unsigned. SmartScreen will say 'Windows protected your PC' and hide Run anyway behind More info. See docs/WINDOWS-SIGNING.md."
            exit 0
          }
          if (-not $useAzure -and $azureMissing.Count -lt $azure.Count) {
            Write-Output "::error::Azure Artifact Signing is half set up. Missing: $($azureMissing -join ', '). See docs/WINDOWS-SIGNING.md."
            exit 1
          }
          if ($usePfx -ne [bool]$env:PFX_PASSWORD) {
            Write-Output "::error::WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD go together; only one is set. See docs/WINDOWS-SIGNING.md."
            exit 1
          }
          if ($useAzure -and $usePfx) {
            Write-Output "::error::Both Azure Artifact Signing and WINDOWS_CERTIFICATE are set. Pick one and remove the other's secrets, so there is no doubt which certificate a release carries."
            exit 1
          }

          $work = Join-Path $env:RUNNER_TEMP 'rata-sign'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          if ($useAzure) {
            if ($env:AZ_ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$') {
              Write-Output "::error::AZURE_ENDPOINT should look like https://weu.codesigning.azure.net (the region the signing account is in)."
              exit 1
            }
            # The newest x64 signtool in the Windows SDK: the dlib is x64 and
            # needs signtool 10.0.22621.755 or later.
            $signtool = Get-ChildItem -ErrorAction SilentlyContinue "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
            if (-not $signtool) { Write-Output "::error::No x64 signtool.exe in the Windows SDK on this runner."; exit 1 }
            # Microsoft's signing client, pinned by version and by hash.
            $ver = '1.0.128'
            $sha = '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b'
            $pkg = Join-Path $work 'client.zip'
            Invoke-WebRequest -UseBasicParsing -OutFile $pkg "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$ver/microsoft.artifactsigning.client.$ver.nupkg"
            if ((Get-FileHash -Algorithm SHA256 $pkg).Hash -ne $sha) { Write-Output "::error::Microsoft.ArtifactSigning.Client $ver does not match its pinned hash."; exit 1 }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [IO.Compression.ZipFile]::ExtractToDirectory($pkg, (Join-Path $work 'client'))
            $dlib = Join-Path $work 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
            if (-not (Test-Path $dlib)) { Write-Output "::error::Azure.CodeSigning.Dlib.dll is not where it should be in the signing client."; exit 1 }
            # Only the client secret signs in: every other way the Azure
            # library would try (a managed identity, a cached login...) is off.
            $metadata = Join-Path $work 'metadata.json'
            [IO.File]::WriteAllText($metadata, (@{
              Endpoint = $env:AZ_ENDPOINT; CodeSigningAccountName = $env:AZ_ACCOUNT; CertificateProfileName = $env:AZ_PROFILE
              ExcludeCredentials = @('WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential',
                'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzureCliCredential', 'AzurePowerShellCredential',
                'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
            } | ConvertTo-Json), $utf8)
            $conf = @{ bundle = @{ windows = @{ signCommand = @{
              cmd = $signtool.FullName
              args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                '/d', 'RATA', '/dlib', $dlib, '/dmdf', $metadata, '%1')
            } } } }
            # The dlib signs in with these, read from the environment of the
            # bundler (and of makensis, which signs the uninstaller).
            @(
              "AZURE_TENANT_ID<<__RATA_EOF__", $env:AZ_TENANT, "__RATA_EOF__",
              "AZURE_CLIENT_ID<<__RATA_EOF__", $env:AZ_CLIENT, "__RATA_EOF__",
              "AZURE_CLIENT_SECRET<<__RATA_EOF__", $env:AZ_SECRET, "__RATA_EOF__"
            ) | Add-Content -Path $env:GITHUB_ENV
            $mode = 'azure'
            Write-Output "Signing Windows binaries with Azure Artifact Signing (signtool $($signtool.Directory.Parent.Name))."
          } else {
            # Read from memory, never written out as a file: the certificate
            # and its key go straight into this user's store, where signtool
            # finds them by thumbprint. (A certutil -encode copy carries
            # BEGIN/END lines; they are not base64 and are dropped.)
            try {
              $bytes = [Convert]::FromBase64String(($env:PFX -replace '-----[^-]+-----', ''))
            } catch {
              Write-Output "::error::WINDOWS_CERTIFICATE is not base64. Encode the .pfx as docs/WINDOWS-SIGNING.md says."
              exit 1
            }
            $imported = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $imported.Import($bytes, $env:PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]'UserKeySet, PersistKeySet')
            $bytes = $null
            $store = [Security.Cryptography.X509Certificates.X509Store]::new(
              [Security.Cryptography.X509Certificates.StoreName]::My, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite); $store.AddRange($imported); $store.Close()
            # Every certificate that came in, chain included, so the clean-up
            # at the end of the job can take them all out again.
            "thumbprints=$(($imported | ForEach-Object Thumbprint) -join ',')" >> $env:GITHUB_OUTPUT
            # The one with its private key and the Code Signing usage.
            $cert = $null
            foreach ($c in $imported) {
              if (-not $c.HasPrivateKey) { continue }
              foreach ($ext in $c.Extensions) {
                if ($ext -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] -and
                    @($ext.EnhancedKeyUsages | ForEach-Object Value) -contains '1.3.6.1.5.5.7.3.3') { $cert = $c }
              }
              if ($cert) { break }
            }
            if (-not $cert) { Write-Output "::error::WINDOWS_CERTIFICATE holds no code-signing certificate with its private key."; exit 1 }
            if ($cert.NotAfter -lt (Get-Date)) { Write-Output "::error::The Windows signing certificate expired on $($cert.NotAfter.ToString('yyyy-MM-dd'))."; exit 1 }
            # Tauri's own signtool call: /sha1 <thumbprint> /fd sha256, and an
            # RFC 3161 timestamp so the signature outlives the certificate.
            $conf = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'; tsp = $true
            } } }
            $mode = 'pfx'
            Write-Output "Signing Windows binaries with the certificate for $($cert.Subject) (thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter.ToString('yyyy-MM-dd')))."
          }
          # Merged over tauri.conf.json by the CLI, like the updater's. Paths
          # and a thumbprint only; deleted again at the end of the job.
          $confFile = Join-Path $env:GITHUB_WORKSPACE 'desktop/rata-app/src-tauri/tauri.winsign.conf.json'
          [IO.File]::WriteAllText($confFile, ($conf | ConvertTo-Json -Depth 6), $utf8)
          "args=--config src-tauri/tauri.winsign.conf.json" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: tauri-apps/tauri-action@v0
        env:
          # Required whenever this runs from a tag, because that is when the
          # action creates the release and uploads to it. Its absence was
          # invisible for two runs: a manual dispatch leaves tagName empty, so
          # the action skips the release entirely and never asks for a token.
          # The first tag push failed on all four platforms — after every
          # installer had been built — with "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
          # Microsoft sign-in's OAuth client id: public, so a repository
          # variable rather than a secret. Unset is an empty string, which the
          # app reads as "Microsoft sign-in is not configured".
          RATA_MS_CLIENT_ID: ${{ vars.RATA_MS_CLIENT_ID }}
          # The Apple, update and Azure signing variables arrive from the
          # steps above, and only when they are real. Do not add them here.
        with:
          projectPath: desktop/rata-app
          args: ${{ matrix.args }} ${{ steps.updates.outputs.args }} ${{ steps.winsign.outputs.args }}
          # The release made by create-release, or nothing for a build-only
          # run — with no release id and no tag the action only builds.
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: false

      # A signed build is checked the way Windows will check it, on the
      # installer and on the program inside it. Inside, because
      # target/release/rata-app.exe is not what shipped: the bundler signs a
      # patched copy, packs it, then puts the unsigned original back. 7-Zip
      # opens NSIS installers (as verify-release.sh does). /pa is the ordinary
      # Authenticode policy: a signature that does not chain to a root Windows
      # trusts fails, and so does one with no timestamp, which dies with its
      # certificate (Azure's last three days).
      - name: Check the Windows signatures
        id: winverify
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MODE: ${{ steps.winsign.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MODE -or $env:MODE -eq 'none') {
            Write-Output "Unsigned build: no Windows signing secrets are set, so there is no signature to check."
            exit 0
          }
          $signtool = Get-ChildItem -ErrorAction SilentlyContinue "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Output "::error::No x64 signtool.exe in the Windows SDK on this runner."; exit 1 }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          $setups = @(Get-ChildItem -ErrorAction SilentlyContinue desktop/rata-app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setups.Count -eq 0) { Write-Output "::error::No -setup.exe was built, so there is nothing to check."; exit 1 }
          $check = @()
          $i = 0
          foreach ($setup in $setups) {
            $check += $setup.FullName
            $inside = Join-Path $env:RUNNER_TEMP "rata-verify\$i"; $i++
            & $sevenZip x -y "-o$inside" $setup.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::7-Zip could not open $($setup.Name)."; exit 1 }
            $app = Get-ChildItem -Recurse -File -Path $inside -Filter 'rata-app.exe' | Select-Object -First 1
            if (-not $app) { Write-Output "::error::No rata-app.exe inside $($setup.Name)."; exit 1 }
            $check += $app.FullName
            # The uninstaller is signed while makensis runs; whether 7-Zip
            # shows it depends on its version, so it is checked when it can be.
            Get-ChildItem -Recurse -File -Path $inside -Filter 'uninstall.exe' | ForEach-Object { $check += $_.FullName }
          }
          # signtool's own exit code decides, not PowerShell's view of its stderr.
          $ErrorActionPreference = 'Continue'
          $bad = @()
          foreach ($file in $check) {
            Write-Output "::group::signtool verify /pa /v $file"
            $out = & $signtool.FullName verify /pa /v $file 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $out
            Write-Output "::endgroup::"
            if ($code -ne 0) { $bad += "$file (signtool exit $code)" }
            elseif ($out -match 'not timestamped') { $bad += "$file (no timestamp)" }
            else { Write-Output "Signed: $file" }
          }
          if ($bad.Count) {
            foreach ($b in $bad) { Write-Output "::error::Bad Windows signature: $b" }
            exit 1
          }
          Write-Output "Every Windows binary checked is signed, trusted and timestamped ($($check.Count) files, $env:MODE)."
          exit 0

      # Each installer is installed on its own runner the way a customer would
      # install it, and started with no licence and no mailbox (it shows the
      # licence box). It must stay up 15 s and show "RATA <version> beta" as
      # its window title, which is how testers report their build, so a title
      # left behind at the last version fails here. The window is built in
      # setup (main.rs) and a failed setup ends the process, so staying up
      # also means the window was made; a panic in the log fails as well.
      # After the signature check, so a signed build is tested as signed; the
      # smoke itself is the same either way. Before the installers are kept
      # and before the signing material goes. The scripts are in
      # desktop/rata-app/harness/, and each says what it can and cannot see.
      #
      # Linux: apt installs the .deb, then /usr/bin/rata-app runs under Xvfb
      # on a 1366x768 screen (so fit_to_screen has to shrink the window, and
      # that is checked too), with a fresh HOME: a first launch, no app data
      # directory yet, and no user-dirs.dirs. The AppImage is run the same
      # way, extracted, since the runner has no FUSE. xdotool reads the title.
      # macOS: the .dmg is mounted and RATA.app copied out, and the program
      # inside it is run (the Intel build through Rosetta). A hosted runner
      # may refuse System Events the Accessibility permission it needs to
      # read another app's window title; then the title is not asserted, a
      # warning says so, and what is asserted is that the app stays up with
      # a clean log.
      - name: Install and launch the app
        id: smoke
        timeout-minutes: 10
        if: runner.os != 'Windows'
        shell: bash
        working-directory: desktop/rata-app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          EXPECT_TITLE: ${{ needs.plan.outputs.prerelease == 'true' && format('RATA {0} beta', needs.plan.outputs.version) || format('RATA {0}', needs.plan.outputs.version) }}
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get install -y --no-install-recommends xvfb xdotool
          fi
          ./harness/smoke-installed.sh

      # Windows: the NSIS installer runs silently (/S, the per-user install
      # a customer gets), the installed rata-app.exe is found where the
      # installer registered it, started, and its main window title read
      # with Get-Process.
      - name: Install and launch the app (Windows)
        id: winsmoke
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/rata-app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          EXPECT_TITLE: ${{ needs.plan.outputs.prerelease == 'true' && format('RATA {0} beta', needs.plan.outputs.version) || format('RATA {0}', needs.plan.outputs.version) }}
        run: ./harness/smoke-installed.ps1 -Version $env:VERSION -Expect $env:EXPECT_TITLE

      # The installer reached the draft release before the check above could
      # run, and the publish job below publishes whatever is attached. A
      # Windows installer whose signature failed must not be what ships, so it
      # comes off the draft (its update signature with it); the run's artifact
      # still has it for looking into. A published release is never touched.
      - name: Keep a badly signed installer off the release
        if: failure() && steps.winverify.outcome == 'failure' && needs.create-release.outputs.id != ''
        uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            const release_id = Number(process.env.ID);
            const { data: r } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!r.draft) { core.warning(`${r.tag_name} is already published; its Windows installer was left in place. Replace it by hand.`); return; }
            for (const a of r.assets) {
              if (!/-setup\.exe(\.sig)?$/.test(a.name)) continue;
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: a.id });
              core.info(`Removed ${a.name} from the draft ${r.tag_name}.`);
            }

      # The same for an installer that installed but did not start, or
      # started under the wrong title: this platform's files come off the
      # draft (update bundles and signatures with them) and stay on the run
      # as an artifact. The other platforms still ship. The two macOS builds
      # share a release, so each takes off only its own architecture's.
      - name: Keep an installer that does not start off the release
        if: >-
          failure() && needs.create-release.outputs.id != '' &&
          (steps.smoke.outcome == 'failure' || steps.winsmoke.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
          SLUG: ${{ matrix.slug }}
        with:
          script: |
            const mine = {
              'linux': /_amd64\.(deb|AppImage)(\.sig)?$/,
              'macos-apple-silicon': /_aarch64\.(dmg|app\.tar\.gz|app\.tar\.gz\.sig)$/,
              'macos-intel': /_(x64|x86_64)\.(dmg|app\.tar\.gz|app\.tar\.gz\.sig)$/,
              'windows': /-setup\.exe(\.sig)?$/,
            }[process.env.SLUG];
            if (!mine) { core.setFailed(`No asset pattern for ${process.env.SLUG}.`); return; }
            const release_id = Number(process.env.ID);
            const { data: r } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!r.draft) { core.warning(`${r.tag_name} is already published; its ${process.env.SLUG} installer was left in place. Replace it by hand.`); return; }
            for (const a of r.assets) {
              if (!mine.test(a.name)) continue;
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: a.id });
              core.info(`Removed ${a.name} from the draft ${r.tag_name}: it did not pass the launch check.`);
            }

      # `always()` because the installers are worth keeping precisely when
      # something went wrong. Without it a failure in the step above — which
      # runs *after* the bundles are built — threw away four finished
      # installers and left nothing to download anywhere.
      - name: Keep the installers on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rata-${{ matrix.slug }}
          # One pattern per thing tauri.conf.json actually builds — deb,
          # appimage, dmg, nsis. There used to be a *.msi here too, which
          # matched nothing because `msi` is not in that target list. It went
          # unnoticed because if-no-files-found only fires when *every* pattern
          # misses, so the NSIS one covered for it and the job kept promising an
          # installer it had never produced.
          path: |
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.deb
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      # Last, and whatever happened above: the signing client and its
      # metadata, the Tauri signing config, the unpacked installers, and every
      # certificate the .pfx brought into this runner's store, private keys
      # included. (The .pfx itself is never written to disk.) GitHub's runners
      # are thrown away after the job anyway; this is so that nothing depends
      # on that.
      - name: Remove the Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          THUMBPRINTS: ${{ steps.winsign.outputs.thumbprints }}
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            (Join-Path $env:RUNNER_TEMP 'rata-sign'), (Join-Path $env:RUNNER_TEMP 'rata-verify'), 'desktop/rata-app/src-tauri/tauri.winsign.conf.json'
          foreach ($t in @($env:THUMBPRINTS -split ',' | Where-Object { $_ })) {
            try {
              Remove-Item -Force -DeleteKey -ErrorAction Stop "Cert:\CurrentUser\My\$t"
            } catch {
              # Without -DeleteKey at least the certificate goes.
              try { Remove-Item -Force -ErrorAction Stop "Cert:\CurrentUser\My\$t" } catch { Write-Output "::warning::Could not remove certificate $t from the runner's store: $_" }
            }
          }
          Write-Output "Windows signing material removed."
          exit 0

  # Out of draft once the installers are on it. Publishing is also what
  # creates the tag, at the commit the release was made from. A release with
  # nothing attached stays a draft: an empty release page is worse than none.
  # A partial one is published — one platform's upload failing (the Linux
  # AppImage did, once, with "Error saving asset") must not hold back the rest.
  publish:
    name: Publish release
    needs: [plan, create-release, installers]
    if: always() && needs.create-release.result == 'success' && needs.installers.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            const release_id = Number(process.env.ID);
            const { data: r } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            const names = r.assets.map((a) => a.name);
            core.info(`Attached: ${names.join(', ') || 'nothing'}`);
            if (!names.length) {
              core.setFailed(`No installers were attached to ${r.tag_name}, so it was left as a draft.`);
              return;
            }
            if (!names.some((n) => n.endsWith('.deb'))) core.warning('No Linux installer on this release.');
            if (!names.some((n) => n.endsWith('-setup.exe'))) core.warning('No Windows installer on this release.');
            if (!names.some((n) => n.endsWith('.dmg'))) core.warning('No macOS installer on this release.');
            if (!r.draft) {
              core.info(`${r.tag_name} is already published.`);
              return;
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false });
            core.info(`Published ${r.tag_name}: https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${r.tag_name}`);

      # The update feed, on a release tagged `updater`: a fixed address,
      # because 0.x releases are pre-releases and GitHub's "latest release"
      # link skips those. Only installers with a signature go in it (the app
      # refuses anything else anyway), each under its own installer's keys, so
      # a .deb install is never handed the AppImage. One file per kind of
      # installation (latest-<key>.json, which copies after 0.1.42 read first),
      # so a platform whose installer came off this release keeps the version
      # it had instead of vanishing, plus latest.json for older copies. Nothing
      # moves backwards. The rules are desktop/rata-app/harness/feed.cjs, tested
      # by feed.test.cjs in the gate; this step only reads and uploads.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/rata-app/harness
      - uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            const feed = require('./desktop/rata-app/harness/feed.cjs');
            const release_id = Number(process.env.ID);
            const { data: r } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (r.draft) { core.info('Still a draft; the feed is left alone.'); return; }
            const version = r.tag_name.replace(/^v/, '');
            const byName = new Map(r.assets.map((a) => [a.name, a]));
            const read = async (a) => {
              const res = await github.rest.repos.getReleaseAsset({ ...context.repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } });
              return Buffer.from(res.data).toString('utf8').trim();
            };
            const installers = [];
            for (const a of r.assets) {
              const sig = byName.get(a.name + '.sig');
              if (!feed.keysFor(a.name).length || !sig) continue;
              installers.push({ name: a.name, url: a.browser_download_url, signature: await read(sig) });
            }
            if (!installers.length) {
              core.info('No signed installers on this release (no update key is configured), so the feed is left alone.');
              return;
            }

            const all = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            let home = all.find((x) => x.tag_name === 'updater');
            if (!home) {
              home = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: 'updater',
                target_commitish: context.sha,
                name: 'Update feed (not an installer)',
                body: 'RATA reads latest-<platform>.json, or latest.json, from here to learn when a newer version is out. The installers are on the version releases.',
                prerelease: true,
              })).data;
            }
            // What the feed says now, read before anything is written.
            const old = {};
            for (const a of home.assets || []) {
              if (!feed.FILES.includes(a.name)) continue;
              try {
                old[a.name] = JSON.parse(await read(a));
              } catch (e) {
                core.warning(`${a.name} on the updater release is not JSON (${e.message}); it is treated as absent.`);
              }
            }
            const { write, log } = feed.plan({ version, pubDate: r.published_at || new Date().toISOString(), installers, old });
            for (const line of log) core.info(line);
            for (const [name, body] of Object.entries(write)) {
              const was = (home.assets || []).find((a) => a.name === name);
              if (was) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: was.id });
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: home.id, name, data: JSON.stringify(body, null, 2), headers: { 'content-type': 'application/json' } });
              core.info(`Wrote ${name} (${body.version}).`);
            }
