name: Release installers

# The three build machines RATA needs, because one machine cannot be all three:
# a .dmg has to be made on macOS and a Windows installer on Windows, and
# neither can be produced — let alone signed — from Linux.
#
# Tag a version to cut a release, or run it by hand to get installers to test
# without tagging anything.

on:
  push:
    tags:
      - "v*"
  # A manual run builds the installers and attaches them to the run without
  # creating a release, which is what you want when you just need something to
  # install and try.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not cancel the other two: a macOS signing
      # problem is not a reason to throw away a finished Windows build.
      fail-fast: false
      matrix:
        include:
          # `slug` names the artifact and keys the cache. It is written out
          # rather than derived from `os` and `args`, which produced
          # "rata-macos-latest--target aarch64-apple-darwin" — a build flag and
          # a runner label, spaces and all, in the name of the thing somebody
          # downloads.
          - name: Linux (.deb, .AppImage)
            slug: linux
            os: ubuntu-22.04
            args: ""
          - name: macOS (Apple silicon)
            slug: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            slug: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Windows (.exe)
            slug: windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 rather than 24.04, deliberately: an AppImage built against
      # a newer glibc will not start on an older distribution, and the point of
      # an AppImage is that it runs anywhere. Build on the oldest thing you are
      # willing to support.
      - name: Install the system webview
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-app/src-tauri
          # The two macOS entries share a runner and build different targets,
          # so they must not share a cache.
          key: ${{ matrix.slug }}

      # Before the build, not after: Tauri compiles the web assets into the
      # binary, so building first would package whatever ui/ held last time.
      - name: Assemble the web assets
        run: ./sync-ui.sh
        shell: bash
        working-directory: desktop/rata-app

      # Refused rather than built without one. A build with no licence key
      # refuses every licence — which is the right way for it to fail, and
      # exactly the wrong thing to hand a customer who has paid.
      - name: Check the licence key is present
        shell: bash
        env:
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: |
          if [ -z "${RATA_LICENCE_PUBLIC_KEY}" ]; then
            echo "::error::RATA_LICENCE_PUBLIC_KEY is not set. Add it as a repository secret." >&2
            echo "Without it every installer this workflow produces refuses every licence." >&2
            echo "It is the public half — see rata-next/LICENSING.md — and is not a secret;" >&2
            echo "it lives in Actions secrets so it cannot be changed by accident." >&2
            exit 1
          fi
          case "${RATA_LICENCE_PUBLIC_KEY}" in
            *"BEGIN PUBLIC KEY"*) ;;
            *) echo "::error::RATA_LICENCE_PUBLIC_KEY does not look like a PEM public key." >&2; exit 1 ;;
          esac

      # Signing is opt-in, and it has to be all-or-nothing.
      #
      # These used to be passed straight to the build step, which looked
      # harmless: an unset secret becomes an empty string. But an empty string
      # is still a *set* variable, and Tauri's bundler reads APPLE_CERTIFICATE
      # with std::env::var — which returns Ok("") and takes that as "sign this".
      # It then handed nothing to `security import` and both macOS jobs died at
      # the bundling step with "failed to import keychain certificate", having
      # compiled everything successfully first. Linux and Windows were fine,
      # which is what made it look like a macOS problem rather than a workflow
      # one.
      #
      # So the variables only enter the environment when there is actually a
      # certificate, and the log says which build you are getting.
      - name: Configure macOS signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CERT}" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned."
            echo "::warning::This macOS build is unsigned. Gatekeeper will tell whoever opens it that RATA is damaged and can't be opened, which is indistinguishable from a broken download. Set the Apple signing secrets before sending it to anybody."
            exit 0
          fi
          # The heredoc form, because a certificate is base64 and a password
          # can contain anything.
          {
            printf 'APPLE_CERTIFICATE<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT}"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT_PASSWORD}"
            printf 'APPLE_SIGNING_IDENTITY<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${IDENTITY}"
          } >> "$GITHUB_ENV"
          echo "Signing with the configured Apple certificate."
          # Notarisation is a second, separate thing: without it a signed app
          # still warns on first open. Only switched on when all three are set,
          # because a half-configured notary fails the build at the very end.
          if [ -n "${NOTARY_ID}" ] && [ -n "${NOTARY_PASSWORD}" ] && [ -n "${NOTARY_TEAM}" ]; then
            {
              printf 'APPLE_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_ID}"
              printf 'APPLE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_PASSWORD}"
              printf 'APPLE_TEAM_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_TEAM}"
            } >> "$GITHUB_ENV"
            echo "Notarising as well."
          else
            echo "::warning::Signing but not notarising — APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. A signed but un-notarised app still warns on first open."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
          # The Apple variables arrive from the step above, and only when they
          # are real. Do not add them here.
        with:
          projectPath: desktop/rata-app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: RATA ${{ github.ref_name }}
          releaseBody: |
            Install RATA, then paste the licence key from
            https://mailrata.org/account.

            Your mailbox passwords stay on this computer, in its own keychain.
          releaseDraft: true
          # Published by hand. A release that appears the moment a tag is
          # pushed is a release nobody checked.
          prerelease: false
          # A tag publishes a draft release; a manual run just leaves the
          # installers attached to the run for testing.
          includeUpdaterJson: false

      - name: Keep the installers on the run
        uses: actions/upload-artifact@v4
        with:
          name: rata-${{ matrix.slug }}
          # One pattern per thing tauri.conf.json actually builds — deb,
          # appimage, dmg, nsis. There used to be a *.msi here too, which
          # matched nothing because `msi` is not in that target list. It went
          # unnoticed because if-no-files-found only fires when *every* pattern
          # misses, so the NSIS one covered for it and the job kept promising an
          # installer it had never produced.
          path: |
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.deb
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: error
          retention-days: 14
