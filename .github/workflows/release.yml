name: Release installers

# The three build machines RATA needs, because one machine cannot be all three:
# a .dmg has to be made on macOS and a Windows installer on Windows, and
# neither can be produced — let alone signed — from Linux.
#
# A release happens when `main` carries a version that has not been released
# yet: bump `version` in desktop/rata-app/src-tauri/tauri.conf.json (and the
# window title and Cargo.toml beside it), merge, and v<version> is built and
# published. Nobody creates a tag by hand. That step failed three times out of
# four in the GitHub UI — a tag field that rejects spaces, a dropdown that
# offers the old tag first, a "Publish" that did not publish — and it is also
# the one step an assistant session cannot do (tag pushes return 403 for it).
# The tag is created by this workflow's own token, when the release is
# published.
#
# Pushing a v* tag still works, and a manual run still builds installers to
# try without releasing anything.

on:
  push:
    branches: [main]
    # A merge that cannot change the app does not need to be looked at.
    paths:
      - "desktop/**"
      - "rata-next/public/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating the release and attaching installers to it is a write to the
# repository's contents, so the default read-only token is not enough.
permissions:
  contents: write

jobs:
  # Whether this run releases anything, and under which tag.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/rata-app/src-tauri/tauri.conf.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # 0.x is beta: marked pre-release so nobody mistakes it for finished.
          case "${version}" in 0.*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Manual run: installers only, no release."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "Tag ${REF_NAME} pushed: releasing it."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released — nothing to build. Bump the version to release."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} has not been released yet — building and releasing it."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

  # One release, made before the builds rather than by them: four builds each
  # finding no release and creating one is a race that leaves duplicates. Made
  # as a draft so nobody sees an empty release while the installers build, and
  # reused if a draft for this tag already exists, so a re-run does not add a
  # second one.
  create-release:
    name: Create release
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        with:
          script: |
            const { TAG, VERSION, PRERELEASE } = process.env;
            const pre = PRERELEASE === 'true';
            // listReleases includes drafts; getReleaseByTag does not.
            const all = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const found = all.find((r) => r.tag_name === TAG);
            if (found) {
              core.info(`Reusing release ${found.id} for ${TAG} (draft: ${found.draft}).`);
              core.setOutput('id', String(found.id));
              return;
            }
            const made = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name: pre ? `RATA ${VERSION} beta` : `RATA ${VERSION}`,
              body: [
                'Install RATA, then paste your licence key.',
                '',
                'Your mailbox passwords stay on this computer, in its own keychain.',
                ...(pre ? ['', 'This is a beta. How to test it and how to report a problem: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/BETA.md'] : []),
              ].join('\n'),
              draft: true,
              prerelease: pre,
            });
            core.info(`Created draft release ${made.data.id} for ${TAG} at ${context.sha}.`);
            core.setOutput('id', String(made.data.id));

  installers:
    name: ${{ matrix.name }}
    needs: [plan, create-release]
    # create-release is skipped for a build-only run, and a skipped need would
    # otherwise skip this job too.
    if: >-
      always() && needs.plan.outputs.build == 'true' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not cancel the other two: a macOS signing
      # problem is not a reason to throw away a finished Windows build.
      fail-fast: false
      matrix:
        include:
          # `slug` names the artifact and keys the cache. It is written out
          # rather than derived from `os` and `args`, which produced
          # "rata-macos-latest--target aarch64-apple-darwin" — a build flag and
          # a runner label, spaces and all, in the name of the thing somebody
          # downloads.
          - name: Linux (.deb, .AppImage)
            slug: linux
            os: ubuntu-22.04
            args: ""
          - name: macOS (Apple silicon)
            slug: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            slug: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Windows (.exe)
            slug: windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 rather than 24.04, deliberately: an AppImage built against
      # a newer glibc will not start on an older distribution, and the point of
      # an AppImage is that it runs anywhere. Build on the oldest thing you are
      # willing to support.
      - name: Install the system webview
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rata-app/src-tauri
          # The two macOS entries share a runner and build different targets,
          # so they must not share a cache.
          key: ${{ matrix.slug }}

      # Before the build, not after: Tauri compiles the web assets into the
      # binary, so building first would package whatever ui/ held last time.
      - name: Assemble the web assets
        run: ./sync-ui.sh
        shell: bash
        working-directory: desktop/rata-app

      # Refused rather than built without one. A build with no licence key
      # refuses every licence — which is the right way for it to fail, and
      # exactly the wrong thing to hand a customer who has paid.
      - name: Check the licence key is present
        shell: bash
        env:
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
        run: |
          if [ -z "${RATA_LICENCE_PUBLIC_KEY}" ]; then
            echo "::error::RATA_LICENCE_PUBLIC_KEY is not set. Add it as a repository secret." >&2
            echo "Without it every installer this workflow produces refuses every licence." >&2
            echo "It is the public half — see rata-next/LICENSING.md — and is not a secret;" >&2
            echo "it lives in Actions secrets so it cannot be changed by accident." >&2
            exit 1
          fi
          case "${RATA_LICENCE_PUBLIC_KEY}" in
            *"BEGIN PUBLIC KEY"*) ;;
            *) echo "::error::RATA_LICENCE_PUBLIC_KEY does not look like a PEM public key." >&2; exit 1 ;;
          esac

      # Signing is opt-in, and it has to be all-or-nothing.
      #
      # These used to be passed straight to the build step, which looked
      # harmless: an unset secret becomes an empty string. But an empty string
      # is still a *set* variable, and Tauri's bundler reads APPLE_CERTIFICATE
      # with std::env::var — which returns Ok("") and takes that as "sign this".
      # It then handed nothing to `security import` and both macOS jobs died at
      # the bundling step with "failed to import keychain certificate", having
      # compiled everything successfully first. Linux and Windows were fine,
      # which is what made it look like a macOS problem rather than a workflow
      # one.
      #
      # So the variables only enter the environment when there is actually a
      # certificate, and the log says which build you are getting.
      - name: Configure macOS signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CERT}" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned."
            echo "::warning::This macOS build is unsigned. Gatekeeper will tell whoever opens it that RATA is damaged and can't be opened, which is indistinguishable from a broken download. Set the Apple signing secrets before sending it to anybody."
            exit 0
          fi
          # The heredoc form, because a certificate is base64 and a password
          # can contain anything.
          {
            printf 'APPLE_CERTIFICATE<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT}"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${CERT_PASSWORD}"
            printf 'APPLE_SIGNING_IDENTITY<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${IDENTITY}"
          } >> "$GITHUB_ENV"
          echo "Signing with the configured Apple certificate."
          # Notarisation is a second, separate thing: without it a signed app
          # still warns on first open. Only switched on when all three are set,
          # because a half-configured notary fails the build at the very end.
          if [ -n "${NOTARY_ID}" ] && [ -n "${NOTARY_PASSWORD}" ] && [ -n "${NOTARY_TEAM}" ]; then
            {
              printf 'APPLE_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_ID}"
              printf 'APPLE_PASSWORD<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_PASSWORD}"
              printf 'APPLE_TEAM_ID<<__RATA_EOF__\n%s\n__RATA_EOF__\n' "${NOTARY_TEAM}"
            } >> "$GITHUB_ENV"
            echo "Notarising as well."
          else
            echo "::warning::Signing but not notarising — APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. A signed but un-notarised app still warns on first open."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          # Required whenever this runs from a tag, because that is when the
          # action creates the release and uploads to it. Its absence was
          # invisible for two runs: a manual dispatch leaves tagName empty, so
          # the action skips the release entirely and never asks for a token.
          # The first tag push failed on all four platforms — after every
          # installer had been built — with "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RATA_LICENCE_PUBLIC_KEY: ${{ secrets.RATA_LICENCE_PUBLIC_KEY }}
          # The Apple variables arrive from the step above, and only when they
          # are real. Do not add them here.
        with:
          projectPath: desktop/rata-app
          args: ${{ matrix.args }}
          # The release made by create-release, or nothing for a build-only
          # run — with no release id and no tag the action only builds.
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: false

      # `always()` because the installers are worth keeping precisely when
      # something went wrong. Without it a failure in the step above — which
      # runs *after* the bundles are built — threw away four finished
      # installers and left nothing to download anywhere.
      - name: Keep the installers on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rata-${{ matrix.slug }}
          # One pattern per thing tauri.conf.json actually builds — deb,
          # appimage, dmg, nsis. There used to be a *.msi here too, which
          # matched nothing because `msi` is not in that target list. It went
          # unnoticed because if-no-files-found only fires when *every* pattern
          # misses, so the NSIS one covered for it and the job kept promising an
          # installer it had never produced.
          path: |
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.deb
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/rata-app/src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # Out of draft once the installers are on it. Publishing is also what
  # creates the tag, at the commit the release was made from. A release with
  # nothing attached stays a draft: an empty release page is worse than none.
  # A partial one is published — one platform's upload failing (the Linux
  # AppImage did, once, with "Error saving asset") must not hold back the rest.
  publish:
    name: Publish release
    needs: [plan, create-release, installers]
    if: always() && needs.create-release.result == 'success' && needs.installers.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            const release_id = Number(process.env.ID);
            const { data: r } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            const names = r.assets.map((a) => a.name);
            core.info(`Attached: ${names.join(', ') || 'nothing'}`);
            if (!names.length) {
              core.setFailed(`No installers were attached to ${r.tag_name}, so it was left as a draft.`);
              return;
            }
            if (!names.some((n) => n.endsWith('-setup.exe'))) core.warning('No Windows installer on this release.');
            if (!names.some((n) => n.endsWith('.dmg'))) core.warning('No macOS installer on this release.');
            if (!r.draft) {
              core.info(`${r.tag_name} is already published.`);
              return;
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false });
            core.info(`Published ${r.tag_name}: https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${r.tag_name}`);
