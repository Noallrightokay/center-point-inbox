[package]
name = "rata-mail"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net"] }

[features]
# The mail layer does not need serde; the app that shows the mail does. Kept
# optional so the crate stays usable on its own.
serde = ["dep:serde"]
# For tests/loopback.rs only: lets the outbound guard accept the literal
# 127.0.0.1, so the engine can be run against real mail servers on the test
# machine (tests/loopback/servers.sh). Off by default, and a compile error in
# any build without debug assertions; build.rs also refuses it whenever
# PROFILE is release, even with debug assertions forced on. A release build
# cannot have it.
loopback-tests = []
# On a Mac, look names up the way an iOS build always does, through the
# system's own resolver (src/dns_sd.rs) rather than hickory, so that path can
# be tested on one (.github/workflows/mail-apple.yml). It does nothing on any
# other system (build.rs), and the macOS app does not turn it on.
system-dns = []

[[test]]
name = "loopback"
required-features = ["loopback-tests"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
futures = "0.3.34"
rustls-platform-verifier = "0.7.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "io-util"] }
tokio-rustls = "0.26.5"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
ammonia = "4.2.0"

# iOS asks the system's own resolver instead (src/dns_sd.rs): its sandbox has
# none of the settings hickory reads (/etc/resolv.conf, or on Apple systems
# the System Configuration store), and nothing there uses hickory, so it is
# not built for iOS at all.
[target.'cfg(not(target_os = "ios"))'.dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
