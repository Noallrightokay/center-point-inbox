[package]
name = "rata-app"
version = "0.1.52"
edition = "2024"
description = "RATA — your mail, on your machine"
default-run = "rata-app"

# What main.rs ran is the library's `run` (lib.rs), so that a phone can start
# it too: iOS links the static library into its app, Android loads the
# shared one. The `_lib` suffix keeps its files apart from the program's on
# Windows. The program, `rata-app`, is still what the desktop installers
# ship, under that name.
[lib]
name = "rata_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reading the config the CLI hands over (`TAURI_CONFIG`), to leave the
# updater's out of a build without self-update (build.rs). Already in the
# tree through tauri-build, so nothing new is built.
serde_json = "1"

[dependencies]
rata-mail = { path = "../../rata-mail", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures = "0.3"
# Signing in with Microsoft (oauth.rs): randomness for PKCE and state, the
# challenge's hash, the form bodies, and one HTTPS client for Microsoft's
# token endpoint. All four were already in the tree (reqwest through the
# updater, with the same TLS as the mail connections), so nothing new is built.
getrandom = "0.3"
sha2 = "0.11"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }

# Handing a web address to the browser, and a file RATA made to its app
# (links.rs, created.rs), after RATA's own checks, on a computer: the
# system's own opener, given it as one argument, as in every release. Not
# on a phone, where an app cannot start a program.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
open = "5"

# On a phone the system opens a web address for RATA: the opener plugin's
# mobile half (links.rs), called from Rust only; the page is granted none
# of it. A phone only, so that a computer's build stays as it was: the
# plugin also turns on the `open` crate's ShellExecuteExW for Windows,
# which would change how every Windows installer opens a link or a file.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-opener = "2"

# A second launch handing over to the first (lib.rs, review R5), on
# Windows and Linux; on macOS the list's lock is the only guard, and a
# phone runs one copy of an app at a time by itself. Its Linux half uses
# zbus and its Windows half windows-sys, both already in the tree.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "2"

# On iOS RATA writes its keychain entries itself, to stay on the phone
# (vault.rs: keyring's iOS writer files them to go into backups and onto
# another phone, with no setting for it), and marks its data folders as
# never backed up (backup.rs). The versions keyring's own iOS backend uses,
# through security-framework 2, so nothing new is built.
[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
security-framework-sys = { version = "2", default-features = false }

# Whether the session bus's address can be read before single instance's
# plugin is set up, which panics when it cannot (lib.rs). The zbus the
# plugin itself uses, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Marking saved files as downloads on macOS (mark.rs). Already in the tree
# through the updater's tar, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

# Writing Windows keychain entries that stay on this computer, and listing
# them (vault.rs, review R6): keyring writes every one to roam and has no
# setting for it. The version and features keyring itself uses, so nothing
# new is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
# Create file's tests (created.rs): reading and writing deflated zip entries
# when checking what a blank .docx, .xlsx or .pptx must be. Already in the
# tree (png, the updater), so nothing new is downloaded.
flate2 = "1"

[features]
default = ["self-update"]
# Updating itself from RATA's own releases (update.rs), as the desktop
# installers do. Left out (--no-default-features) of a build for an app
# store or a phone, which its store updates: such a build has no updater,
# no feed address and no updater key in it (build.rs), and answers the page
# as a build without the key does.
self-update = ["dep:tauri-plugin-updater"]
# A self-test run as RATA starts (src/smoke.rs), for a device nobody can
# watch: the iOS Simulator job in .github/workflows/ios.yml. Never on by
# default and never in a release; harness/verify-release.sh fails a
# published binary that holds its words.
smoke = []
