[package]
name = "rata-app"
version = "0.1.52"
edition = "2024"
description = "RATA — your mail, on your machine"
default-run = "rata-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rata-mail = { path = "../../rata-mail", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures = "0.3"
# Signing in with Microsoft (oauth.rs): randomness for PKCE and state, the
# challenge's hash, the form bodies, and one HTTPS client for Microsoft's
# token endpoint. All four were already in the tree (reqwest through the
# updater, with the same TLS as the mail connections), so nothing new is built.
getrandom = "0.3"
sha2 = "0.11"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }

# A second launch handing over to the first (main.rs, review R5), on
# Windows and Linux; on macOS the list's lock is the only guard. Its Linux
# half uses zbus and its Windows half windows-sys, both already in the tree.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Whether the session bus's address can be read before single instance's
# plugin is set up, which panics when it cannot (main.rs). The zbus the
# plugin itself uses, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Marking saved files as downloads on macOS (mark.rs). Already in the tree
# through the updater's tar, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

# Writing Windows keychain entries that stay on this computer, and listing
# them (vault.rs, review R6): keyring writes every one to roam and has no
# setting for it. The version and features keyring itself uses, so nothing
# new is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
# Create file's tests (created.rs): reading and writing deflated zip entries
# when checking what a blank .docx, .xlsx or .pptx must be. Already in the
# tree (png, the updater), so nothing new is downloaded.
flate2 = "1"

[features]
# Tauri needs this to build a release binary without a console window on Windows.
default = []
