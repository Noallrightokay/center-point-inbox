apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: center-point-inbox
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
