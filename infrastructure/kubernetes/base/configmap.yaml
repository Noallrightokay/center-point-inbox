apiVersion: v1
kind: ConfigMap
metadata:
  name: center-point-inbox-config
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/part-of: center-point-inbox
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # JWT Configuration
  JWT_ISSUER: "https://app.centerpointinbox.com"
  JWT_AUDIENCE: "center-point-inbox-api"
  JWT_TOKEN_EXPIRY_MINUTES: "60"
  JWT_REFRESH_TOKEN_EXPIRY_DAYS: "30"
  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq.center-point-inbox.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "centerpoint"
  RABBITMQ_VHOST: "center-point-inbox"
  # Redis
  REDIS_CONNECTION: "redis.center-point-inbox.svc.cluster.local:6379,abortConnect=false,connectTimeout=5000"
  # PostgreSQL
  POSTGRES_HOST: "postgresql.center-point-inbox.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "centerpointinbox"
  POSTGRES_USERNAME: "centerpoint"
  POSTGRES_CONNECTION_STRING: "Host=postgresql.center-point-inbox.svc.cluster.local;Port=5432;Database=centerpointinbox;Username=centerpoint;Password=__POSTGRES_PASSWORD__;Pooling=true;MinPoolSize=5;MaxPoolSize=100"
  # CORS
  CORS_ALLOWED_ORIGINS: "https://app.centerpointinbox.com"
  # MinIO / Object Storage
  MINIO_ENDPOINT: "minio.center-point-inbox.svc.cluster.local:9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "center-point-inbox"
  # Service URLs (internal)
  AUTH_SERVICE_URL: "http://auth-service.center-point-inbox.svc.cluster.local"
  GOOGLE_PROVIDER_URL: "http://google-provider.center-point-inbox.svc.cluster.local"
  MICROSOFT_PROVIDER_URL: "http://microsoft-provider.center-point-inbox.svc.cluster.local"
  MERGER_SERVICE_URL: "http://merger-service.center-point-inbox.svc.cluster.local"
  AI_ASSISTANT_URL: "http://ai-assistant.center-point-inbox.svc.cluster.local"
  AUDIT_DLP_URL: "http://audit-dlp.center-point-inbox.svc.cluster.local"
  # Logging
  LOG_LEVEL: "Information"
