apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: center-point-inbox
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
