apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-worker
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/name: translation-worker
    app.kubernetes.io/part-of: center-point-inbox
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: translation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: translation-worker
        app.kubernetes.io/part-of: center-point-inbox
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: translation-worker
          image: center-point-inbox/translation-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: center-point-inbox-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: openai-api-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: postgres-password
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f translation-worker || exit 1
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f translation-worker || exit 1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
