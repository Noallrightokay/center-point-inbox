apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/name: ai-assistant
    app.kubernetes.io/part-of: center-point-inbox
    app.kubernetes.io/component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
        app.kubernetes.io/part-of: center-point-inbox
        app.kubernetes.io/component: ai
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: ai-assistant
          image: center-point-inbox/ai-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: center-point-inbox-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: openai-api-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: postgres-password
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: rabbitmq-password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: center-point-inbox-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
