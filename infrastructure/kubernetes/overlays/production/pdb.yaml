apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: center-point-inbox
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: center-point-inbox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
