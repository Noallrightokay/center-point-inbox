apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: center-point-inbox

commonLabels:
  environment: production

resources:
  - ../../base
  - pdb.yaml

patches:
  # --- Higher replica counts for production ---
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: google-provider
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: microsoft-provider
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: merger-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: translation-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: ai-assistant
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: audit-dlp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

  # --- Higher resource limits for production ---
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: "1Gi"

  # --- Production HPA tuning ---
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
  - target:
      kind: HorizontalPodAutoscaler
      name: merger-service-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15

  # --- Production ConfigMap patches ---
  - target:
      kind: ConfigMap
      name: center-point-inbox-config
    patch: |
      - op: replace
        path: /data/ASPNETCORE_ENVIRONMENT
        value: Production
      - op: replace
        path: /data/LOG_LEVEL
        value: Warning
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "https://app.centerpointinbox.com"
      - op: replace
        path: /data/JWT_ISSUER
        value: "https://app.centerpointinbox.com"
