<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<title>Your RATA licence</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* DESIGN.md tokens, the same as the app's. */
:root{
  --bg:#F5F6F8; --card:#FCFCFD; --fill:#ECEEF1; --fill-2:#F1F2F4;
  --ink:#15171C; --slate:#51565F; --faint:#6B717B; --hair:rgba(21,23,28,.10);
  --tint:#2B4FC7; --tint-btn:#2B4FC7; --tint-btn-hover:#233FA3; --tint-soft:rgba(43,79,199,.09); --on-tint:#FCFCFD;
  --red:#B4262D; --red-soft:rgba(180,38,45,.08); --green:#17744A; --green-soft:rgba(23,116,74,.10); --amber:#8A5B0C; --amber-soft:rgba(138,91,12,.10);
  --shadow-lg:0 12px 32px -8px rgba(21,23,28,.22),0 2px 6px rgba(21,23,28,.08);
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --paper:var(--card); --wash:var(--tint-soft); --disp:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1014; --card:#15181D; --fill:#1F232A; --fill-2:#1A1D23;
    --ink:#E7E9EE; --slate:#A4AAB5; --faint:#838A96; --hair:rgba(231,233,238,.11);
    --tint:#8FA6F2; --tint-btn:#3E5FD6; --tint-btn-hover:#4A6BE0; --tint-soft:rgba(143,166,242,.13);
    --red:#F07A7F; --red-soft:rgba(240,122,127,.12); --green:#4CC38A; --green-soft:rgba(76,195,138,.12); --amber:#E0A94A; --amber-soft:rgba(224,169,74,.13);
    --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(231,233,238,.08);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.card{width:min(560px,100%);background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);padding:30px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo b{font-family:'Fredoka',var(--sans);font-weight:600;font-size:22px;letter-spacing:.04em}
.mk{border-radius:50%;background:#F5F6F8;padding:2px;box-sizing:content-box}
.tag{font-size:13px;color:var(--faint);margin-bottom:22px}
h1{font-weight:600;font-size:20px;letter-spacing:-.015em;margin-bottom:4px}
.sub{font-size:14px;color:var(--slate);line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:5px;margin-bottom:14px}
.chip.live{background:var(--green-soft);color:var(--green)}
.chip.none{background:var(--fill);color:var(--slate)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.key{margin-top:16px;background:var(--fill-2);border:1px solid var(--hair);border-radius:8px;padding:12px 14px}
.key code{display:block;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--ink);word-break:break-all;user-select:all}
.keyrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.go{padding:10px 18px;border:none;border-radius:8px;background:var(--tint-btn);color:var(--on-tint);font-family:var(--sans);font-weight:600;font-size:14.5px;cursor:pointer;transition:background-color .12s;text-decoration:none;display:inline-block}
.go:hover{background:var(--tint-btn-hover)}
.go:active,.ghost:active{transform:translateY(1px)}
.go:disabled{opacity:.6;cursor:default}
.ghost{padding:10px 16px;border:none;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.ghost:hover{background:var(--fill-2)}
.steps{counter-reset:s;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.steps li{list-style:none;counter-increment:s;position:relative;padding-left:34px;margin-bottom:12px;font-size:14px;color:var(--slate);line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:30%;background:var(--fill);color:var(--slate);display:grid;place-items:center;font:500 11.5px/1 var(--mono)}
.note{font-size:13px;color:var(--faint);line-height:1.6;margin-top:16px;padding-top:15px;border-top:1px solid var(--hair)}
.note a,.sub a{color:var(--tint);text-decoration:none;font-weight:500}
.note a:hover,.sub a:hover{text-decoration:underline}
.msg{font-size:13px;font-weight:500;padding:10px 12px;border-radius:8px;margin-top:16px;line-height:1.55}
.msg.bad{background:var(--red-soft);color:var(--red)}
.msg.good{background:var(--green-soft);color:var(--green)}
.foot{margin-top:22px;padding-top:15px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--faint);flex-wrap:wrap}
.foot .sp{flex:1}
.foot a,.linkbtn{color:var(--slate);text-decoration:none;font-weight:500;background:none;border:none;font-family:var(--sans);font-size:13px;cursor:pointer;padding:0}
.foot a:hover,.linkbtn:hover{color:var(--ink)}
.skel{height:13px;background:var(--fill);border-radius:6px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img class="mk" src="icons/mark-256.png" alt="" width="36" height="36">
    <b>RATA</b>
  </div>
  <div class="tag">Your mail, on your machine.</div>

  <div id="body">
    <h1>Your licence</h1>
    <div class="skel" style="width:70%"></div>
    <div class="skel" style="width:90%"></div>
  </div>

  <div class="foot">
    <a href="/">← Home</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
    <span class="sp"></span>
    <span id="who"></span>
    <button class="linkbtn" id="out" style="display:none">Sign out</button>
  </div>
</div>

<script src="config.js"></script>
<script>
/* The licence page.

   One job: show a paying customer the key that makes the desktop app run, and
   tell them what to do with it. Everything else on this page exists to make
   that one job legible when it cannot be done — no account, no subscription,
   no backend — because "your licence" with an empty box under it is the worst
   possible answer for somebody who has just paid. */
const CFG = Object.assign({}, window.RATA_CONFIG || {}, JSON.parse(localStorage.getItem('centra_deploy_cfg') || '{}'));
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);
const body = document.getElementById('body');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let SBP = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
}
async function supa() {
  if (!CLOUD) return null;
  if (!SBP) {
    if (!window.supabase) await loadScript('vendor/supabase-js-2.112.4.js');
    SBP = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  }
  return SBP;
}

function show(html) { body.innerHTML = html; }

/* The token is base64url JSON and readable on purpose — there is nothing
   secret in "this person bought Pro", and showing somebody the date their own
   licence runs to beats asking them to trust that it has one. */
function expiryOf(token) {
  try {
    const payload = JSON.parse(atob(String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    if (!payload.exp) return null;
    return new Date(payload.exp * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return null; }
}

function howTo() {
  return `<ol class="steps">
    <li>Install RATA on your computer and open it.</li>
    <li>It asks for a licence key the first time. Paste this one in.</li>
    <li>That is the last time you will see this page. RATA keeps working offline for thirty days at a stretch and renews itself whenever it is online.</li>
  </ol>`;
}

function licensed(d) {
  const until = expiryOf(d.licence);
  show(`
    <span class="chip live">● ${esc(d.planLabel || 'Licensed')}</span>
    <h1>Your licence key</h1>
    <p class="sub">Issued to <b>${esc(d.email)}</b>${until ? `, and good until <b>${esc(until)}</b>` : ''}. The app renews it on its own, so you should not need to come back here.</p>
    <div class="key"><code id="k">${esc(d.licence)}</code></div>
    <div class="keyrow">
      <button class="go" id="copy">Copy licence key</button>
      <a class="ghost" href="/#download">Get the app</a>
    </div>
    <div id="copied"></div>
    ${howTo()}
    <p class="note">Keep it to yourself: anyone with this key can run RATA as you while your subscription is live, since the app renews it, and for up to thirty days after it ends. Nothing on this page can switch a key off. If it gets out, <a href="privacy.html#contact">contact us</a>.</p>
  `);
  document.getElementById('copy').addEventListener('click', async e => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(d.licence);
      document.getElementById('copied').innerHTML = '<div class="msg good">Copied. Paste it into RATA on your computer.</div>';
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy licence key'; }, 2500);
    } catch {
      /* Clipboard access can be refused, and there is a perfectly good
         fallback: the key is already selectable. */
      document.getElementById('copied').innerHTML = '<div class="msg bad">This browser would not let the page copy for you. Select the key above and copy it yourself.</div>';
      const r = document.createRange();
      r.selectNodeContents(document.getElementById('k'));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
  });
}

/* Just back from Stripe.

   Stripe redirects the customer and delivers the webhook independently, and the
   redirect usually wins by a second or two — so somebody who has this moment
   paid can arrive here and be told they have no active plan. That is the single
   worst sentence this page could show them, and it is the most likely one on
   their very first visit.

   So when we know they have just come from checkout, an unsubscribed answer is
   treated as "not yet" rather than "no", and we wait for the webhook. And a
   purchase the webhook has recorded but not finished (/api/licence's
   'pending': the plan not named yet, or a bank transfer not cleared) is
   "setting up" whenever it is seen, with no buy buttons: a second checkout
   would be a second subscription. The page never says the payment has not
   reached us; after the wait it says the key will appear on reload. */
const JUST_PAID = /(^|[?&])checkout=success(&|$)/.test(location.search);
const WAIT_STEPS = 30;
const WAIT_GAP = 2000;

/* Carry the signed-in address into a Stripe Payment Link. The licence is
   keyed on the address paid with, so prefilled_email fills Stripe's field
   with the account's; client_reference_id (Stripe keeps letters, digits, -
   and _, up to 200) rides along so a payment can be matched to the account
   if they change the address anyway. Only https links that leave this site:
   a fallback to our own pricing section gains nothing from an address.
   The same function in index.html and in app.html's renderPlan
   (tests/account.test.mjs and app.test.mjs check each). */
function buyLink(u, email, uid) {
  if (!u) return u;
  try {
    const url = new URL(u);
    if (url.protocol !== 'https:' || url.host === location.host || /(^|\.)mailrata\.org$/.test(url.hostname)) return u;
    if (email) url.searchParams.set('prefilled_email', email);
    if (uid && /^[A-Za-z0-9_-]{1,200}$/.test(uid)) url.searchParams.set('client_reference_id', uid);
    return url.toString();
  } catch (e) { return u; }
}

function settlingUp(attempt) {
  show(`
    <span class="chip live">● Payment received</span>
    <h1>Setting up your licence…</h1>
    <p class="sub">Stripe has your payment and we are setting up your licence. This usually takes a few seconds.</p>
    <div class="skel" style="width:${Math.min(92, 20 + attempt * 3)}%"></div>
    <p class="note">Nothing is lost if you close this page: your subscription is already active, or will be as soon as a bank transfer clears. The key will be here whenever you come back.</p>
  `);
}

/* The wait is over and there is still no key. Still no buy buttons: they have
   paid, or are paying, and a second checkout would be a second
   subscription. */
function stillSettingUp(d) {
  show(`
    <span class="chip warn">Setting up</span>
    <h1>Setting up your licence</h1>
    <p class="sub">${d.reason === 'pending'
      ? 'Your checkout has reached us. Your key will appear here when you reload this page, usually within a few minutes. If you paid by bank transfer, it appears once the transfer clears.'
      : 'This is taking longer than usual. Your key will appear here when you reload this page, usually within a few minutes.'}</p>
    <div class="keyrow"><button class="go" id="reload">Reload</button></div>
    ${d.reason === 'pending' ? '' : `<p class="note">Signed in as ${esc(d.email || '')}. The licence is keyed on the address you paid with. If you paid with a different one, sign out and sign in with that address instead.</p>`}
  `);
  document.getElementById('reload').addEventListener('click', () => location.reload());
}

function unsubscribed(d) {
  const uid = (d.uid || '');
  show(`
    <span class="chip none">No active plan</span>
    <h1>Choose a plan to get your key</h1>
    <p class="sub">${esc(d.message || 'There is no active subscription on this account.')}</p>
    <div class="keyrow">
      <a class="go" href="${esc(buyLink(CFG.stripeBase, d.email, uid) || '/#pricing')}">RATA Base, $12.99</a>
      <a class="ghost" href="${esc(buyLink(CFG.stripePro, d.email, uid) || '/#pricing')}">RATA Pro, $23.99</a>
    </div>
    <p class="note">Signed in as ${esc(d.email || '')}. Pay with this same address and the key appears here straight after: the subscription and the licence are keyed on it.</p>
  `);
}

/* `text` is what the customer reads; `detail` is what they can quote to us.
   The two are never the same string. A deployment message like
   "LICENCE_PRIVATE_KEY is not set" is true, useless to the person reading it,
   and reads like an accusation to somebody who has just paid — but it is
   exactly what support needs, so it goes underneath in small type with a label
   saying what it is for. */
function problem(text, action, detail) {
  show(`
    <span class="chip warn">Not available</span>
    <h1>Your licence</h1>
    <div class="msg bad">${esc(text)}</div>
    ${action || ''}
    ${detail ? `<p class="note">If you get in touch, this is the part that helps us find it:<br><code style="font-family:var(--mono);font-size:11.5px;word-break:break-word">${esc(detail)}</code></p>` : ''}
  `);
}

(async function () {
  if (!CLOUD) {
    /* A deployment with no database has no accounts and therefore no
       subscriptions to look a licence up against. Saying so beats a sign-in
       form that cannot work. */
    return problem(
      'This deployment has no accounts configured, so there are no licences to show. RATA still runs on this device without one.',
      '<div class="keyrow"><a class="go" href="/app">Open RATA here</a></div>'
    );
  }

  const sb = await supa();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    /* Both ways in come back here, and a buyer straight from Stripe keeps
       ?checkout=success through sign-up (auth.html passes it on), so the
       page still waits for the webhook afterwards. */
    const paid = JUST_PAID ? '&checkout=success' : '';
    return show(`
      <h1>Sign in to see your licence</h1>
      <p class="sub">${JUST_PAID
        ? 'Thank you for paying. Log in, or create an account, with the address you paid with: your licence key is tied to it, and it appears here once you are in.'
        : 'Your licence key is tied to the account you bought with, so we need to know which one that is.'}</p>
      <div class="keyrow">
        <a class="go" href="auth.html?mode=login&next=account${paid}">Log in</a>
        <a class="ghost" href="auth.html?mode=signup&next=account${paid}">Create an account</a>
      </div>
    `);
  }

  const email = (session.user.email || '').toLowerCase();
  document.getElementById('who').textContent = email;
  const out = document.getElementById('out');
  out.style.display = '';
  out.addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

  const ask = async () => {
    const r = await fetch('/api/licence', { headers: { Authorization: 'Bearer ' + session.access_token } });
    return r.json();
  };

  /* Only while the answer is one the webhook is expected to change: a
     purchase it has recorded and not finished, or no subscription at all
     when they have just paid (the redirect beat the webhook). Any other
     answer is taken at face value. */
  const waiting = (d) => d.reason === 'pending' || (JUST_PAID && d.reason === 'no-subscription');
  let d;
  try {
    d = await ask();
    for (let i = 0; waiting(d) && i < WAIT_STEPS; i++) {
      settlingUp(i);
      await new Promise(r => setTimeout(r, WAIT_GAP));
      d = await ask();
    }
  } catch {
    return problem('Could not reach RATA just now. Try again in a moment. If RATA is already running on your computer, it carries on regardless.');
  }

  if (d.licensed && d.licence) return licensed(Object.assign({ email }, d));
  if (waiting(d)) return stillSettingUp(Object.assign({ email }, d));
  if (d.reason === 'no-subscription') return unsubscribed(Object.assign({ email, uid: session.user.id }, d));
  /* Anything else is our fault, not theirs, and must never read as "you have
     not paid" — a customer who has paid and is told that does not come back.
     The server's own words go in `detail`, never in the sentence they read. */
  problem(
    'Your licence could not be issued just now. This is at our end, not yours. Your subscription is unaffected, and RATA keeps working on any computer where it is already running. Try again shortly.',
    '<div class="keyrow"><button class="go" onclick="location.reload()">Try again</button></div>',
    d.error || d.message || ''
  );
})();
</script>
</body>
</html>
